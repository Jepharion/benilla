[package]
name = "benilla-libfpv"
version = "0.1.0"
edition.workspace = true
# libfpv's default build links Betaflight (GPL-3.0), so this crate ships under the GPL.
license = "GPL-3.0-or-later"
description = "WoW FPV: an FPV quad flying through the 1.12 world, on libfpv, built on top of benilla"

[lints]
workspace = true

[features]
# The instruments; the player build is `--no-default-features`.
default = ["dev"]
dev = ["benilla-app/dev"]

[dependencies]
# `default-features = false`, or `--no-default-features` still builds benilla-app with `dev`.
benilla-app = { path = "../benilla-app", default-features = false }
# WoW to Bevy coordinates.
benilla-assets = { path = "../benilla-assets", default-features = false }
# The engine: the worldview's `run_with`, the camera stages, the FOV and the collision ray.
benilla-world = { path = "../benilla-world" }
bevy.workspace = true

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "benilla-libfpv"
path = "src/main.rs"
# Test-building this bin would relink it on every commit, since the build stamp changes.
test = false
